<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081220">
  <meta name="description" content="Objectif 72 : musculation, endurance et bilan du vendredi personnalisés.">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <title>Objectif 72 — Le défi de Gaël</title>
  <style>
    :root { --bg:#070b14; --panel:#0f1726; --panel2:#142033; --ink:#eef6ff; --muted:#9bb0c7; --line:#244260; --mint:#2da8ff; --sky:#66d7ff; --warn:#ffcf8e; --danger:#ff9994; --safe:env(safe-area-inset-bottom, 0px); }
    * { box-sizing:border-box; }
    html {scroll-behavior:smooth;}
    body {margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; -webkit-tap-highlight-color:transparent;}
    button,input,select {font:inherit;}
    button {cursor:pointer;}
    button:focus-visible,input:focus-visible,select:focus-visible {outline:3px solid var(--sky);outline-offset:2px;}
    .shell {max-width:560px; margin:auto; min-height:100vh; padding:0 16px calc(98px + var(--safe));}
    .masthead {display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px;gap:12px;}
    .brand {display:flex;align-items:center;gap:10px;font-size:14px;font-weight:850;letter-spacing:.4px;}
    .logo {width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:var(--mint);color:#0b1820;font-size:19px;box-shadow:0 7px 30px #2da8ff33;}
    .pill {background:#102033;border:1px solid var(--line);padding:8px 11px;border-radius:999px;color:var(--mint);font-weight:750;font-size:12px;white-space:nowrap;}
    h1 {font-size:29px;line-height:1.1;letter-spacing:-1px;margin:6px 0 10px;}
    h2 {font-size:19px;margin:0 0 12px;letter-spacing:-.3px;}
    h3 {font-size:15px;line-height:1.3;margin:0;}
    p {line-height:1.5;}
    .eyebrow {font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:1.5px;color:var(--mint);}
    .muted {color:var(--muted);}
    .small {font-size:12px;line-height:1.5;}
    .hero {background:linear-gradient(125deg,#10253b,#0f2741 55%,#0d1f34);border:1px solid #2e5b8b; padding:21px;border-radius:22px;position:relative;overflow:hidden;}
    .hero:after {content:"";position:absolute;width:180px;height:180px;right:-85px;top:-65px;border:25px solid #ffffff08;border-radius:100%;pointer-events:none;}
    .hero p {margin:0;max-width:340px;color:#d4e7ec;}
    .hero-actions {display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
    .btn {border:0;border-radius:14px;background:var(--mint);color:#10202a;padding:12px 16px;min-height:44px;font-weight:820;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;}
    .btn.secondary {background:#17314d;color:var(--ink);border:1px solid #345d8f;}
    .btn.ghost {background:transparent;color:var(--ink);border:1px solid var(--line);}
    .btn:disabled {opacity:.5;cursor:not-allowed;}
    .btn.full {width:100%;}
    .btn.sm {font-size:12px;min-height:38px;padding:7px 12px;border-radius:11px;}
    .stats {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0 22px;}
    .personal-intro {display:flex;align-items:center;gap:9px;margin:3px 0 14px;color:var(--muted);font-size:13px;}
    .personal-intro strong{color:var(--ink);font-size:16px;}
    .focus-card{background:linear-gradient(125deg,#122741,#101f36);border:1px solid #3673ab;border-radius:18px;padding:17px;margin-bottom:12px;}
    .focus-card h2 {margin:0 0 9px;}
    .focus-card p{font-size:13px;margin:0;line-height:1.55;color:#d0e4ec;}
    .focus-line{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:13px;color:#d0e3ed;}
    .focus-line b{min-width:23px;font-size:17px;color:var(--mint);}
    .review-row{display:flex;gap:8px;justify-content:space-between;margin:6px 0 18px;}
    .review-btn{flex:1;min-width:0;border-radius:12px;min-height:44px;background:#173355;color:var(--ink);border:1px solid #346896;font-weight:750;}
    .review-btn.selected{background:#14456f;border-color:var(--mint);color:var(--mint);}
    .stat,.card {background:var(--panel);border:1px solid var(--line);border-radius:18px;}
    .stat {padding:13px 12px;min-width:0;}
    .stat strong {display:block;font-size:22px;letter-spacing:-.7px;}
    .stat span {display:block;color:var(--muted);font-size:11px;margin-top:2px;}
    .sectiontitle {display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 1px 11px;}
    .sectiontitle h2 {margin:0;}
    .card {padding:17px;margin-bottom:11px;}
    .day {display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
    .day:last-child {border-bottom:0;padding-bottom:0;}
    .day:first-child {padding-top:0;}
    .dayicon {width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;background:#15314f;color:var(--mint);border-radius:14px;font-size:19px;}
    .day .desc {flex:1;min-width:0;}
    .day .desc strong {display:block;font-size:14px;}
    .day .desc span {display:block;color:var(--muted);font-size:12px;margin-top:3px;}
    .chip {font-size:11px;font-weight:800;color:var(--sky);border-radius:8px;background:#143151;padding:6px 7px;white-space:nowrap;}
    .chip.done {color:var(--mint);background:#123c63;}
    .progress {height:9px;background:#173a5b;border-radius:999px;overflow:hidden;}
    .progress > i {display:block;height:100%;background:linear-gradient(90deg,#2b8fff,var(--mint));border-radius:inherit;transition:width .25s;}
    .trackrow {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;}
    .workex {padding:14px 0;border-top:1px solid var(--line);}
    .workex:first-of-type {border-top:0;}
    .exercise-head {display:flex;justify-content:space-between;align-items:start;gap:10px;}
    .exercise-head span {color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;}
    .sets {display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .set {min-width:43px;min-height:43px;border-radius:12px;border:1px solid #3a6c9c;background:#17395d;color:var(--ink);font-weight:850;}
    .set.checked {background:var(--mint);border-color:var(--mint);color:#0d2136;}
    .tip {background:#162d49;padding:11px 12px;border-left:3px solid var(--sky);border-radius:9px;color:#bed3de;font-size:12px;line-height:1.55;}
    .timer {text-align:center;padding:24px 15px;background:linear-gradient(145deg,#102944,#0f1d31);border:1px solid #356b9f;border-radius:20px;margin:14px 0;}
    .time {font-size:clamp(54px,18vw,76px);font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 18px;}
    .timer-actions {display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .wake-status {margin:14px 0 0;color:#b9d3df;font-size:12px;line-height:1.5;min-height:18px;}
    .wake-status.active {color:var(--mint);}
    .wake-status.warn {color:var(--warn);}
    .grid2 {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .field {display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted);font-weight:680;}
    .field input,.field select {width:100%;background:#0d1828;border:1px solid #35638f;color:var(--ink);min-height:44px;border-radius:12px;padding:9px 12px;outline-offset:2px;}
    .field input[type=date]{color-scheme:dark;}
    .measure {display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);}
    .measure:last-child {border:0;}
    .measure .value {font-weight:800;font-variant-numeric:tabular-nums;}
    .nav {position:fixed;z-index:100;left:0;right:0;bottom:0;background:#081221f0;backdrop-filter:blur(18px);border-top:1px solid #355064;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + var(--safe)) max(12px,env(safe-area-inset-left));}
    .navin {display:grid;grid-template-columns:repeat(6,1fr);max-width:560px;margin:auto;gap:4px;}
    .nav button {border:0;border-radius:11px;background:transparent;color:#92abba;min-height:51px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;}
    .nav button span {font-size:19px;}
    .nav button.active {background:#103b67;color:var(--mint);}
    .hidden {display:none!important;}
    .tabs {display:flex;gap:8px;margin:15px 0;}
    .tabs button {flex:1;background:#132743;color:#abc2d0;border:1px solid #35658f;padding:12px 8px;border-radius:12px;font-weight:800;font-size:13px;}
    .tabs button.selected {background:#155896;color:#ecf8ff;border-color:#54b7ff;}
    .weeknav {display:flex;align-items:center;justify-content:space-between;gap:9px;margin:4px 0 16px;}
    .weeknav button {background:#183251;color:var(--ink);border:1px solid #35638d;border-radius:10px;padding:8px 12px;min-width:40px;}
    .card-note {font-size:13px;color:var(--muted);line-height:1.55;}
    .badge {display:inline-flex;align-items:center;color:#c9ebff;font-weight:800;background:#154c7d;border-radius:999px;font-size:11px;padding:7px 10px;}
    .log-date {font-size:11px;color:var(--muted);}
    .spark {width:100%;height:155px;display:block;}
    .footnote {color:#879eae;font-size:11px;line-height:1.6;margin-top:17px;}
    .switchline {display:flex;align-items:center;justify-content:space-between;gap:15px;margin:14px 0;}
    .switchline input {width:20px;height:20px;accent-color:#91f2cb;}
    .empty {color:var(--muted);text-align:center;padding:26px 18px;line-height:1.5;}
    .toast {position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe));width:max-content;max-width:90vw;background:#d3efff;color:#0d2238;font-weight:750;border-radius:14px;padding:11px 16px;box-shadow:0 12px 30px #0008;pointer-events:none;}
    .chiprow {display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
    .chiprow span {display:inline-block;background:#173250;border:1px solid #376996;border-radius:99px;color:#c9dce5;padding:7px 10px;font-size:11px;font-weight:700;}
    .interval-current {font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:1.2px;color:var(--mint);}
    .interval-next {font-size:13px;color:var(--muted);margin:8px 0 0;}
    .iconcheck {background:var(--mint);color:#0a233a;font-weight:850;border-radius:50%;padding:2px 6px;}

    .nav button{font-size:10px;}
    .nav button span{font-size:18px;}
    .navin{gap:1px;}
    .quicklinks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0;}
    .quicklinks button{min-height:50px;}
    .detail-group{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
    .detail-toggle{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:850; background:#143250;border:1px solid #396a98;border-radius:12px;padding:12px;margin-top:12px;}
    .detail-toggle[aria-expanded="true"]{border-color:#74d3ff;}
    .metric-big{font-size:18px;font-weight:850;}
    .metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0;}
    .metric-grid>div{background:#14304e;padding:10px;border-radius:11px;}
    .metric-grid span{display:block;color:var(--muted);font-size:11px;}
    .metric-grid strong{display:block;font-size:15px;margin-top:4px;}
    .metric-graph{min-height:150px;}
    .measure-card{background:#122b46;border:1px solid #245781;border-radius:13px;padding:13px;margin:10px 0;}
    .measure-card h3{margin-bottom:8px;}
    .photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .photo-tile{background:#122743;border:1px solid #355064;border-radius:13px;overflow:hidden;}
    .photo-tile img{width:100%;height:174px;object-fit:cover;display:block;background:#183855;}
    .photo-tile .inner{padding:11px;}
    .photo-tile .inner strong{display:block;font-size:12px;}
    .photo-tile .inner small{display:block;color:var(--muted);font-size:11px;margin:4px 0 10px;}
    .photo-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .photo-compare img{width:100%;height:205px;object-fit:contain;background:#09131c;border-radius:12px;}
    .photo-compare .field{min-width:0;}
    .filebtn{display:block;border-radius:13px;border:1px dashed #5c93ba;padding:17px 12px;text-align:center;font-weight:800;color:var(--mint);margin-top:10px;}
    .filebtn input{display:block;width:100%;font-size:12px;margin:8px 0 0;color:var(--muted);}
    .guide-icon{width:100%;height:170px;display:block;margin:10px auto 12px;border-radius:14px;background:linear-gradient(135deg,#10365e,#0c2138);}
    .pose-one{animation:posefirst 3s ease-in-out infinite;}
    .pose-two{animation:posesecond 3s ease-in-out infinite;}
    @keyframes posefirst{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
    @keyframes posesecond{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
    .guide-list{margin:0;padding-left:22px;line-height:1.8;color:#d4e6ed;}
    .mini-note{font-size:11px;color:#98adba;line-height:1.5;}
    @media(max-width:370px){.nav button{font-size:9px}.nav button span{font-size:17px}.photo-tile img{height:150px}}
    @media(prefers-reduced-motion:reduce){.pose-one,.pose-two{animation:none}.pose-two{display:none}}
    @media(min-width:680px){.shell{padding-top:10px}.nav{border-radius:20px 20px 0 0}.hero{padding:25px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header class="masthead"><div class="brand"><div class="logo">72</div><div>OBJECTIF 72<br><span style="color:var(--muted);font-weight:550;font-size:11px">Plus fort. Plus endurant.</span></div></div><span class="pill" id="headerWeek">Semaine 1 / 12</span></header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Navigation principale"><div class="navin" id="nav">
  <button data-page="home" class="active"><span>⌂</span>Accueil</button>
  <button data-page="workout"><span>✊</span>Muscu</button>
  <button data-page="cardio"><span>♥</span>Cardio</button>
  <button data-page="progress"><span>▥</span>Balance</button>
  <button data-page="gallery"><span>▣</span>Photos</button>
  <button data-page="settings"><span>⚙</span>Réglages</button>
</div></nav>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='objectif72_data_v1'; // Même clé que les anciennes versions : préserve les données de Gaël
const todayISO=()=>{let d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const safeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultData=()=>({start:'2026-10-12',initialWeight:75,goalWeight:72,initialPushups:30,displayName:'Gaël',reviews:[],logs:[],measures:[],sound:true,soundLevel:'fort',keepAwake:true});
let data=load(),page='home',selectedWorkout='A',selectedCardio='outdoor',viewWeek=1;
let timer={kind:null,running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null,startedAt:0};
let awake=null,audioCtx=null,ticker=null,toaster=null,wakeStatus='idle',trainingMode=false;
let photoList=[],photoDbError='',compareA='',compareB='',activeMetric='weight',editingMeasure=null;
const WORKOUTS={
 A:{name:'Pectoraux + abdos',day:'Lundi',icon:'✊',duration:35,ex:[
  {id:'a1',name:'Pompes pieds surélevés',target:'8–12 répétitions',tip:'Commence avec une petite surélévation et garde le corps aligné.'},
  {id:'a2',name:'Pompes lentes',target:'10–15 répétitions',tip:'Descends en 3 secondes, sans cambrer.'},
  {id:'a3',name:'Dead bug',target:'8 par côté',tip:'Mouvements contrôlés, dos stable.'},
  {id:'a4',name:'Gainage avant-bras',target:'30 secondes',tip:'Respire normalement et évite de creuser le dos.'}
 ]},
 B:{name:'Dos + jambes + gainage',day:'Mercredi',icon:'◈',duration:35,ex:[
  {id:'b1',name:'Tirage avec sac à dos',target:'12 par côté',tip:'Une main en appui, dos neutre; commence léger.'},
  {id:'b2',name:'Squats',target:'15 répétitions',tip:'Descends à l’amplitude confortable.'},
  {id:'b3',name:'Pont fessier',target:'12 répétitions',tip:'Monte le bassin sans forcer sur les lombaires.'},
  {id:'b4',name:'Gainage latéral',target:'20–30 sec par côté',tip:'Aligne épaules, bassin et jambes.'}
 ]},
 C:{name:'Pectoraux + bras + abdos',day:'Vendredi',icon:'✊',duration:35,ex:[
  {id:'c1',name:'Pompes classiques lentes',target:'12–15 répétitions',tip:'Descends en contrôle et conserve 1 à 2 répétitions en réserve.'},
  {id:'c2',name:'Pompes mains rapprochées',target:'8–12 répétitions',tip:'Mains sous les épaules, coudes proches du corps.'},
  {id:'c3',name:'Dead bug',target:'10 par côté',tip:'Expirer au moment d’étendre bras et jambe.'},
  {id:'c4',name:'Gainage latéral',target:'30 sec par côté',tip:'Arrête avant de perdre l’alignement.'}
 ]}
};
const DAYS=[{day:1,label:'Lundi',title:'Pectoraux + abdos',type:'A',sub:'Musculation · 35 min',icon:'✊'},
{day:2,label:'Mardi',title:'Marche rapide',type:'treadmill',sub:'Tapis · 30 min',icon:'↗'},
{day:3,label:'Mercredi',title:'Dos + jambes',type:'B',sub:'Musculation · 35 min',icon:'◈'},
{day:4,label:'Jeudi',title:'Course dehors',type:'outdoor',sub:'Fractionné progressif · 30 min',icon:'♧'},
{day:5,label:'Vendredi',title:'Pectoraux + bras',type:'C',sub:'Musculation · 35 min',icon:'✊'},
{day:6,label:'Samedi',title:'Travail + récupération',type:'rest',sub:'Sans séance sportive',icon:'☾'},
{day:0,label:'Dimanche',title:'Travail + récupération',type:'rest',sub:'Sans séance sportive',icon:'☾'}];
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.logs)&&Array.isArray(d.measures)?{...defaultData(),...d}:defaultData()}catch(e){return defaultData()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Sauvegarde impossible sur ce navigateur. Utilise Exporter.');return false}}
const currentWeek=()=>{let a=new Date(data.start+'T12:00:00'),b=new Date(todayISO()+'T12:00:00');return Math.max(1,Math.min(12,1+Math.floor((b-a)/604800000)))};
const dayOfWeek=()=>new Date(todayISO()+'T12:00:00').getDay();
const weekForDate=date=>{let a=new Date(data.start+'T12:00:00'),b=new Date(date+'T12:00:00');return Math.max(1,Math.min(12,1+Math.floor((b-a)/604800000)))};
function setsFor(week,id){if(week<=2)return 2;if(week===9)return 2;if(week<=4) return id.endsWith('1')?3:2; if(week>=6 && week<=8 && ['a2','c2'].includes(id))return 3; return ['a1','a3','a4','b1','b2','b3','b4','c1','c3'].includes(id)?3:2;}
function titleForDay(d){return d?d.label+' : '+d.title:'Aujourd’hui, récupère !'}
function latestWeight(){return data.measures.filter(m=>Number.isFinite(+m.weight)&&m.weight!=='').slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.weight??data.initialWeight}
function latestWaist(){return data.measures.filter(m=>Number.isFinite(+m.waist)&&m.waist!=='').slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.waist??null}
function logDone(type,date=todayISO()){return data.logs.some(l=>l.type===type&&l.date===date)}
function weekLogs(week){return data.logs.filter(l=>weekForDate(l.date)===week)}
function completedThisWeek(){return new Set(weekLogs(currentWeek()).map(x=>x.type)).size}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toaster);toaster=setTimeout(()=>t.classList.add('hidden'),3500)}
function pageTitle(s,subtitle){return `<div class="eyebrow">TON DÉFI PERSONNEL</div><h1>${s}</h1><p class="muted" style="margin-top:0">${subtitle}</p>`}
function render(){document.getElementById('headerWeek').textContent=`Semaine ${currentWeek()} / 12`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=document.getElementById('view');if(page==='home')v.innerHTML=homeHTML();if(page==='workout')v.innerHTML=workoutHTML();if(page==='cardio')v.innerHTML=cardioHTML();if(page==='progress')v.innerHTML=progressHTML();if(page==='gallery')v.innerHTML=galleryHTML();if(page==='guide')v.innerHTML=guideHTML();if(page==='settings')v.innerHTML=settingsHTML();updateTimerDOM();}
function homeHTML(){
 const day=DAYS.find(d=>d.day===dayOfWeek());
 const done=completedThisWeek(),week=currentWeek(),name=safeText(data.displayName||'Gaël');
 const did=day.type!=='rest'&&logDone(day.type);
 const lastReview=(data.reviews||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
 const encouragement=day.type==='rest'? 'Aujourd’hui, le travail et la récupération passent en premier. Rien à rattraper.' :
 done===0?'Une séance à la fois. Le plus difficile, c’est de se lancer.':
 done<3?'Ça avance ! Garde des répétitions propres et de l’énergie pour la suite.':

// Galerie stockée en IndexedDB, séparément de localStorage pour conserver les images compressées.
const PHOTO_DB='objectif72_photos_v1',PHOTO_STORE='photos';let photoDBPromise=null;
function openPhotoDB(){if(!('indexedDB' in window))return Promise.reject(new Error('Galerie non prise en charge sur ce navigateur'));
 if(photoDBPromise)return photoDBPromise;
 photoDBPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(PHOTO_STORE))r.result.createObjectStore(PHOTO_STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB indisponible'))});return photoDBPromise;}
async function photoDBOp(mode,fn){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,mode),store=tx.objectStore(PHOTO_STORE);const req=fn(store);tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error||new Error('Stockage impossible'));tx.onabort=()=>reject(tx.error||new Error('Opération annulée'))})}
async function refreshPhotos(){try{const raw=await photoDBOp('readonly',s=>s.getAll());photoList.forEach(p=>{if(p.url)URL.revokeObjectURL(p.url)});photoList=raw.map(p=>({...p,url:URL.createObjectURL(p.blob)}));photoDbError=''}catch(err){photoDbError='Galerie inaccessible : '+(err?.message||'erreur de stockage')};if(page==='gallery')render()}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw new Error('Sélectionne une image.');if(file.size>20*1024*1024)throw new Error('Image trop volumineuse (20 Mo maximum).');let bitmap=await createImageBitmap(file);try{let scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Impossible de compresser la photo')),'image/jpeg',.78))}finally{bitmap.close()}}
async function savePhoto(form){const f=getFormData(form);const file=form.querySelector('input[type=file]')?.files?.[0];if(!file){toast('Choisis une photo.');return}const btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Enregistrement…';try{const blob=await compressPhoto(file);const id='p'+Date.now()+'-'+Math.floor(Math.random()*1e6);await photoDBOp('readwrite',s=>s.put({id,date:f.date,angle:f.angle,note:String(f.note||'').slice(0,100),blob}));await refreshPhotos();toast('Photo ajoutée à ta galerie 📷')}catch(err){toast('Photo non enregistrée : '+(err?.message||'erreur'))}finally{if(btn.isConnected){btn.disabled=false;btn.textContent='Enregistrer la photo'}}}
async function deletePhoto(id){if(!confirm('Supprimer cette photo définitivement de la galerie ?'))return;try{await photoDBOp('readwrite',s=>s.delete(id));if(compareA===id)compareA='';if(compareB===id)compareB='';await refreshPhotos();toast('Photo supprimée')}catch(err){toast('Suppression impossible')}}

function nowSec(){return Date.now()/1000}
function remainingSeconds(){return timer.running?Math.max(0,Math.ceil(timer.deadline-nowSec())):timer.remaining}
function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}

function primeAudio(){

 if(!data.sound)return;
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 }catch(e){}

function audioTick(levelOverride=null){
 if(!data.sound && levelOverride===null)return;
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  const level=levelOverride||data.soundLevel||'fort';
  const volume={doux:.10,normal:.24,fort:.43}[level]??.43;
  const now=audioCtx.currentTime+.025;
  // Trois bips distincts, plus longs et nettement plus audibles que l'ancienne sinusoïde courte.
  // Attaque et relâchement progressifs pour limiter les clics / la saturation au casque.
  for(let i=0;i<3;i++){
   const t=now+i*.32;
   const osc=audioCtx.createOscillator();
   const envelope=audioCtx.createGain();
   osc.type='square';
   osc.frequency.setValueAtTime(i===2?1050:900,t);
   envelope.gain.setValueAtTime(0,t);
   envelope.gain.linearRampToValueAtTime(volume,t+.012);
   envelope.gain.setValueAtTime(volume,t+.17);
   envelope.gain.exponentialRampToValueAtTime(.001,t+.24);
   osc.connect(envelope);
   envelope.connect(audioCtx.destination);
   osc.start(t);osc.stop(t+.25);
  }
 }catch(e){}
 try{navigator.vibrate?.([210,100,210,100,280])}catch(e){}
}
function updateWakeStatusDOM(){
 const el=document.getElementById('wakeStatus');if(!el)return;
 const running=timer.running;
 const btn=document.getElementById('trainingModeButton');if(btn){btn.textContent=trainingMode?'☾ Arrêter le mode écran actif':'☀️ Garder l’écran actif pendant la séance';btn.setAttribute('aria-pressed',String(trainingMode))}
 const enabled=data.keepAwake!==false;
 el.className='wake-status';
 if(!enabled){el.textContent='Écran actif désactivé dans Réglages.';return}
 if(!running&&!trainingMode){el.textContent='📱 Lance le chrono ou active le mode séance pour garder l’écran allumé.';return}
 if(awake && !awake.released){el.textContent='✓ Écran maintenu allumé tant que l’application reste visible.';el.classList.add('active');return}
 if(wakeStatus==='unsupported'){el.textContent='⚠️ Maintien de l’écran indisponible ici. Augmente le délai de veille d’Android ou ouvre la version hébergée en HTTPS.';el.classList.add('warn');return}
 if(wakeStatus==='blocked'){el.textContent='⚠️ Android ou le navigateur bloque le maintien de l’écran. Augmente le délai de veille dans les réglages du téléphone.';el.classList.add('warn');return}
 el.textContent='Tentative de maintien de l’écran allumé…';
}
async function requestWake(){
 if((!timer.running && !trainingMode) || data.keepAwake===false || document.hidden){releaseWake();return}
 if(awake && !awake.released){wakeStatus='active';updateWakeStatusDOM();return}
 if(!('wakeLock' in navigator)){wakeStatus='unsupported';updateWakeStatusDOM();return}
 wakeStatus='requesting';updateWakeStatusDOM();
 try{
  const lock=await navigator.wakeLock.request('screen');
  if((!timer.running && !trainingMode) || data.keepAwake===false || document.hidden){await lock.release();return}
  awake=lock;wakeStatus='active';
  lock.addEventListener('release',()=>{if(awake===lock){awake=null;wakeStatus='released';updateWakeStatusDOM()}});
  updateWakeStatusDOM();
 }catch(e){wakeStatus='blocked';updateWakeStatusDOM()}
}
function releaseWake(){const lock=awake;awake=null;wakeStatus='idle';if(lock)lock.release().catch(()=>{});updateWakeStatusDOM()}
function tick(){if(!timer.running)return;let remaining=remainingSeconds();if(remaining>0){updateTimerDOM();return}audioTick();if(timer.kind==='cardio'){if(timer.idx<timer.phases.length-1){timer.idx++;timer.remaining=timer.phases[timer.idx].min*60;timer.deadline=nowSec()+timer.remaining;toast('Étape : '+timer.phases[timer.idx].name)}else{timer.running=false;timer.remaining=0;if(!trainingMode)releaseWake();toast('Bravo, séance cardio terminée !')}}else{timer.running=false;timer.remaining=0;if(!trainingMode)releaseWake();toast('Récupération terminée !')}updateTimerDOM()}
function clearRunning(){timer.running=false;if(!trainingMode)releaseWake()}
function restToggle(){primeAudio();if(timer.kind!=='rest'){clearRunning();timer={kind:'rest',running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};}if(timer.running){timer.remaining=remainingSeconds();clearRunning()}else{if(timer.remaining<=0)timer.remaining=90;timer.running=true;timer.deadline=nowSec()+timer.remaining;requestWake()}updateTimerDOM()}
function cardioToggle(){primeAudio();if(timer.kind!=='cardio'||timer.planId!==selectedCardio||timer.remaining===0){clearRunning();const plan=planFor(selectedCardio);timer={kind:'cardio',running:false,remaining:plan.parts[0].min*60,deadline:0,phases:plan.parts,idx:0,planId:selectedCardio};}if(timer.running){timer.remaining=remainingSeconds();clearRunning()}else{timer.running=true;timer.deadline=nowSec()+timer.remaining;requestWake()}updateTimerDOM()}
function cardioSkip(){primeAudio();if(timer.kind!=='cardio'||timer.planId!==selectedCardio){cardioToggle();return;}if(timer.idx===timer.phases.length-1){clearRunning();timer.remaining=0;toast('Dernière étape terminée !')}else{timer.idx++;timer.remaining=timer.phases[timer.idx].min*60;if(timer.running)timer.deadline=nowSec()+timer.remaining;audioTick()}updateTimerDOM()}
function addLog(type,additional={}){data.logs=data.logs.filter(l=>!(l.date===todayISO()&&l.type===type));data.logs.push({date:todayISO(),type,...additional});save()}
function saveWorkout(){const sets=currentSets().length;const total=document.querySelectorAll('.set').length;if(!sets){toast('Coche au moins une série avant de valider.');return}addLog(selectedWorkout,{setsDone:sets,setsTotal:total});toast('Séance enregistrée, bravo ! 💪');render()}
function saveCardio(){addLog(selectedCardio,{durationMinutes:planFor(selectedCardio).parts.reduce((a,p)=>a+p.min,0)});toast('Séance cardio enregistrée !');render()}
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000)}
async function exportData(){try{const photos=await photoDBOp('readonly',s=>s.getAll());const backed=await Promise.all(photos.map(async p=>({id:p.id,date:p.date,angle:p.angle,note:p.note,dataURL:await blobAsDataURL(p.blob)})));download('objectif72-sauvegarde-complete-'+todayISO()+'.json',new Blob([JSON.stringify({app:'objectif72',version:2,...data,photos:backed})],{type:'application/json'}));toast('Sauvegarde complète avec photos téléchargée !')}catch(err){toast('Export impossible : '+(err?.message||'erreur'))}}
function getFormData(form){return Object.fromEntries(new FormData(form).entries())}
function useForm(form){if(form.id==='measureForm'){const f=getFormData(form);if(!METRICS.some(x=>valOk(f[x[0]]))){toast('Ajoute au moins une valeur de ta balance.');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)){toast('Date invalide');return}const m={date:f.date,note:String(f.note||'').slice(0,200)};for(const [key] of METRICS)m[key]=valOk(f[key])?String(f[key]):'';data.measures=data.measures.filter(x=>x.date!==f.date&&x.date!==editingMeasure);data.measures.push(m);editingMeasure=null;save();render();toast('Pesée détaillée enregistrée ! ⚖️');return}
if(form.id==='photoForm'){savePhoto(form);return}
if(form.id==='reviewForm'){
 const f=getFormData(form);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)){toast('Date invalide');return}
 const entry={date:f.date,energy:Number(f.energy),motivation:Number(f.motivation),sleep:Number(f.sleep),note:String(f.note||'').slice(0,180)};
 if([entry.energy,entry.motivation,entry.sleep].some(n=>!Number.isInteger(n)||n<1||n>5)){toast('Évaluation invalide');return}
 data.reviews=(data.reviews||[]).filter(x=>x.date!==entry.date);
 data.reviews.push(entry);save();render();toast('Bilan du vendredi enregistré ! 💪');return;
 }
 if(form.id==='settingsForm'){const f=getFormData(form);data.displayName=(f.displayName||'Gaël').trim().slice(0,28);data.start=f.start;data.initialWeight=Number(f.initialWeight);data.goalWeight=Number(f.goalWeight);data.initialPushups=Number(f.initialPushups);data.sound=!!f.sound;data.soundLevel=['doux','normal','fort'].includes(f.soundLevel)?f.soundLevel:'fort';data.keepAwake=!!f.keepAwake;if(timer.running||trainingMode){if(data.keepAwake)requestWake();else releaseWake()}save();render();toast('Réglages enregistrés !')}}
function action(name){if(name==='review'){page='progress';render();setTimeout(()=>document.getElementById('fridayReview')?.scrollIntoView({behavior:'smooth',block:'start'}),60);return}if(name==='gotoToday'){gotoToday();return}if(name==='trainingMode'){trainingMode=!trainingMode;if(trainingMode||timer.running)requestWake();else releaseWake();updateWakeStatusDOM();return}if(name==='restToggle'){restToggle();return}if(name==='restReset'){clearRunning();timer={kind:'rest',running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};updateTimerDOM();return}
if(name==='restMinus'||name==='restPlus'){if(timer.kind!=='rest')timer={kind:'rest',running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};let n=Math.max(15,Math.min(300,remainingSeconds()+(name==='restMinus'?-15:15)));timer.remaining=n;if(timer.running)timer.deadline=nowSec()+n;updateTimerDOM();return}
if(name==='cardioToggle'){cardioToggle();return}if(name==='cardioReset'){clearRunning();timer={kind:null,running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};render();return}if(name==='cardioSkip'){cardioSkip();return}if(name==='saveWorkout'){saveWorkout();return}if(name==='saveCardio'){saveCardio();return}if(name==='testSound'){const sel=document.querySelector('select[name="soundLevel"]');audioTick(sel?.value||'fort');toast('Bip de test : vérifie le volume multimédia 🔊');return}if(name==='openGallery'){page='gallery';render();scrollTo(0,0);return}
if(name==='openBalance'){page='progress';render();scrollTo(0,0);return}
if(name==='showGuide'){page='guide';render();scrollTo(0,0);return}
if(name==='openWorkout'){page='workout';render();scrollTo(0,0);return}
if(name==='toggleMoreMetrics'){const m=document.getElementById('moreMetrics');m.classList.toggle('hidden');document.querySelector('.detail-toggle')?.setAttribute('aria-expanded',String(!m.classList.contains('hidden')));return}
if(name==='cancelMeasure'){editingMeasure=null;render();return}
if(name==='importBalance'){document.getElementById('balanceImportFile')?.click();return}
if(name==='export'){exportData();return}if(name==='import'){document.getElementById('importFile')?.click();return}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.guide){chosenGuide=b.dataset.guide;page='guide';render();scrollTo(0,0);return}
if(b.dataset.editMeasure){editingMeasure=b.dataset.editMeasure;page='progress';render();scrollTo(0,0);return}
if(b.dataset.deleteMeasure){if(confirm('Supprimer cette pesée et ses détails ?')){data.measures=data.measures.filter(m=>m.date!==b.dataset.deleteMeasure);if(editingMeasure===b.dataset.deleteMeasure)editingMeasure=null;save();render();toast('Pesée supprimée')}return}
if(b.dataset.deletePhoto){deletePhoto(b.dataset.deletePhoto);return}
if(b.dataset.set){b.classList.toggle('checked');b.setAttribute('aria-pressed',b.classList.contains('checked')?'true':'false');updateSetProgress();return}if(b.dataset.workout){selectedWorkout=b.dataset.workout;clearRunning();timer.kind=null;render();return}if(b.dataset.cardio){selectedCardio=b.dataset.cardio;clearRunning();timer.kind=null;render();return}if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}if(b.dataset.action){action(b.dataset.action);return}});
document.addEventListener('submit',e=>{if(e.target.id==='measureForm'||e.target.id==='settingsForm'||e.target.id==='reviewForm'||e.target.id==='photoForm'){e.preventDefault();useForm(e.target)}});
document.addEventListener('change',async e=>{
 if(e.target.id==='metricSelect'){activeMetric=e.target.value;document.querySelector('.metric-graph').innerHTML=genericGraph();return}
 if(e.target.id==='guideSelect'){chosenGuide=e.target.value;render();return}
 if(e.target.id==='compareA'||e.target.id==='compareB'){if(e.target.id==='compareA')compareA=e.target.value;else compareB=e.target.value;render();return}
 if(e.target.id==='balanceImportFile'){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.objectif72_balance_v1!==true||!Array.isArray(obj.measures)||obj.measures.length>300)throw Error('Fichier de pesées non reconnu');const records=obj.measures.filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date)).map(m=>{const rec={date:m.date,note:String(m.note||'').slice(0,200)};for(const [k] of METRICS){const v=m[k];rec[k]=valOk(v)?String(v):''}return rec});if(!records.length)throw Error('Aucune mesure valide');if(!confirm('Ajouter '+records.length+' pesées à ton carnet ? Une date déjà présente sera mise à jour.'))return;const dates=new Set(records.map(r=>r.date));data.measures=data.measures.filter(m=>!dates.has(m.date)).concat(records);save();render();toast(records.length+' anciennes pesées importées !')}catch(err){toast('Import impossible : '+(err?.message||'Erreur'))}e.target.value='';return}
 if(e.target.id!=='importFile')return;
 const file=e.target.files?.[0];if(!file)return;
 try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.logs)||!Array.isArray(obj.measures)||typeof obj.start!=='string')throw Error('Format invalide');
 if(!confirm('Importer cette sauvegarde ? Cela remplacera les données actuelles'+(Array.isArray(obj.photos)?' ET les photos':'')+'.'))return;
 if(Array.isArray(obj.photos)){
 const imported=[];for(const p of obj.photos){if(typeof p.dataURL==='string'&&p.dataURL.startsWith('data:image/')){const blob=await dataURLBlob(p.dataURL);if(blob.size>5*1024*1024)throw new Error('Photo de sauvegarde trop volumineuse');imported.push({id:String(p.id).slice(0,80),date:p.date,angle:String(p.angle||'Face').slice(0,20),note:String(p.note||'').slice(0,100),blob})}}
 const db=await openPhotoDB();await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite'),store=tx.objectStore(PHOTO_STORE);store.clear();for(const p of imported)store.put(p);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Erreur de restauration'));tx.onabort=()=>reject(tx.error||new Error('Import annulé'))});
 }
 const {photos,...clean}=obj;data={...defaultData(),...clean,reviews:Array.isArray(obj.reviews)?obj.reviews:[]};save();await refreshPhotos();render();toast('Sauvegarde importée !')
 }catch(err){toast('Import impossible : '+(err?.message||'fichier non reconnu'))}
 e.target.value=''
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseWake();else if(timer.running||trainingMode){tick();requestWake()}});
setInterval(tick,250);
// On HTTPS/localhost, cache app resources for offline PWA use. A local HTML file works without SW.
if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
refreshPhotos();
</script>
