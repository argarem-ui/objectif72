<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1724">
  <meta name="description" content="Objectif 72 : programme personnel de musculation, marche, course et suivi de progression.">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <title>Objectif 72 — Mon entraînement</title>
  <style>
    :root { --bg:#0b1320; --panel:#142235; --panel2:#182a3d; --ink:#eef7fc; --muted:#a4b8c7; --line:#2b4253; --mint:#91f2cb; --sky:#7dccf5; --warn:#ffcf8e; --danger:#ff9994; --safe:env(safe-area-inset-bottom, 0px); }
    * { box-sizing:border-box; }
    html {scroll-behavior:smooth;}
    body {margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; -webkit-tap-highlight-color:transparent;}
    button,input,select {font:inherit;}
    button {cursor:pointer;}
    button:focus-visible,input:focus-visible,select:focus-visible {outline:3px solid var(--sky);outline-offset:2px;}
    .shell {max-width:560px; margin:auto; min-height:100vh; padding:0 16px calc(98px + var(--safe));}
    .masthead {display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px;gap:12px;}
    .brand {display:flex;align-items:center;gap:10px;font-size:14px;font-weight:850;letter-spacing:.4px;}
    .logo {width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:var(--mint);color:#0b1820;font-size:19px;box-shadow:0 7px 30px #61daa32a;}
    .pill {background:#172a37;border:1px solid var(--line);padding:8px 11px;border-radius:999px;color:var(--mint);font-weight:750;font-size:12px;white-space:nowrap;}
    h1 {font-size:29px;line-height:1.1;letter-spacing:-1px;margin:6px 0 10px;}
    h2 {font-size:19px;margin:0 0 12px;letter-spacing:-.3px;}
    h3 {font-size:15px;line-height:1.3;margin:0;}
    p {line-height:1.5;}
    .eyebrow {font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:1.5px;color:var(--mint);}
    .muted {color:var(--muted);}
    .small {font-size:12px;line-height:1.5;}
    .hero {background:linear-gradient(125deg,#254556,#18394a 55%,#162d3d);border:1px solid #3b6270; padding:21px;border-radius:22px;position:relative;overflow:hidden;}
    .hero:after {content:"";position:absolute;width:180px;height:180px;right:-85px;top:-65px;border:25px solid #ffffff08;border-radius:100%;pointer-events:none;}
    .hero p {margin:0;max-width:340px;color:#d4e7ec;}
    .hero-actions {display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
    .btn {border:0;border-radius:14px;background:var(--mint);color:#10202a;padding:12px 16px;min-height:44px;font-weight:820;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;}
    .btn.secondary {background:#25394c;color:var(--ink);border:1px solid #3c5568;}
    .btn.ghost {background:transparent;color:var(--ink);border:1px solid var(--line);}
    .btn:disabled {opacity:.5;cursor:not-allowed;}
    .btn.full {width:100%;}
    .btn.sm {font-size:12px;min-height:38px;padding:7px 12px;border-radius:11px;}
    .stats {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0 22px;}
    .stat,.card {background:var(--panel);border:1px solid var(--line);border-radius:18px;}
    .stat {padding:13px 12px;min-width:0;}
    .stat strong {display:block;font-size:22px;letter-spacing:-.7px;}
    .stat span {display:block;color:var(--muted);font-size:11px;margin-top:2px;}
    .sectiontitle {display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 1px 11px;}
    .sectiontitle h2 {margin:0;}
    .card {padding:17px;margin-bottom:11px;}
    .day {display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
    .day:last-child {border-bottom:0;padding-bottom:0;}
    .day:first-child {padding-top:0;}
    .dayicon {width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;background:#223a47;color:var(--mint);border-radius:14px;font-size:19px;}
    .day .desc {flex:1;min-width:0;}
    .day .desc strong {display:block;font-size:14px;}
    .day .desc span {display:block;color:var(--muted);font-size:12px;margin-top:3px;}
    .chip {font-size:11px;font-weight:800;color:var(--sky);border-radius:8px;background:#203447;padding:6px 7px;white-space:nowrap;}
    .chip.done {color:var(--mint);background:#20473f;}
    .progress {height:9px;background:#263e4d;border-radius:999px;overflow:hidden;}
    .progress > i {display:block;height:100%;background:linear-gradient(90deg,#4ccba3,var(--mint));border-radius:inherit;transition:width .25s;}
    .trackrow {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;}
    .workex {padding:14px 0;border-top:1px solid var(--line);}
    .workex:first-of-type {border-top:0;}
    .exercise-head {display:flex;justify-content:space-between;align-items:start;gap:10px;}
    .exercise-head span {color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;}
    .sets {display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .set {min-width:43px;min-height:43px;border-radius:12px;border:1px solid #476071;background:#22384c;color:var(--ink);font-weight:850;}
    .set.checked {background:var(--mint);border-color:var(--mint);color:#14252a;}
    .tip {background:#213442;padding:11px 12px;border-left:3px solid var(--sky);border-radius:9px;color:#bed3de;font-size:12px;line-height:1.55;}
    .timer {text-align:center;padding:24px 15px;background:linear-gradient(145deg,#162f42,#162737);border:1px solid #365569;border-radius:20px;margin:14px 0;}
    .time {font-size:clamp(54px,18vw,76px);font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 18px;}
    .timer-actions {display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .wake-status {margin:14px 0 0;color:#b9d3df;font-size:12px;line-height:1.5;min-height:18px;}
    .wake-status.active {color:var(--mint);}
    .wake-status.warn {color:var(--warn);}
    .grid2 {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .field {display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted);font-weight:680;}
    .field input,.field select {width:100%;background:#0f1c2a;border:1px solid #385063;color:var(--ink);min-height:44px;border-radius:12px;padding:9px 12px;outline-offset:2px;}
    .field input[type=date]{color-scheme:dark;}
    .measure {display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);}
    .measure:last-child {border:0;}
    .measure .value {font-weight:800;font-variant-numeric:tabular-nums;}
    .nav {position:fixed;z-index:100;left:0;right:0;bottom:0;background:#101b28ed;backdrop-filter:blur(18px);border-top:1px solid #355064;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + var(--safe)) max(12px,env(safe-area-inset-left));}
    .navin {display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:auto;gap:4px;}
    .nav button {border:0;border-radius:11px;background:transparent;color:#92abba;min-height:51px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;}
    .nav button span {font-size:19px;}
    .nav button.active {background:#24433e;color:var(--mint);}
    .hidden {display:none!important;}
    .tabs {display:flex;gap:8px;margin:15px 0;}
    .tabs button {flex:1;background:#1a2d3e;color:#abc2d0;border:1px solid #365064;padding:12px 8px;border-radius:12px;font-weight:800;font-size:13px;}
    .tabs button.selected {background:#2f665c;color:#dbfff1;border-color:#75cdb0;}
    .weeknav {display:flex;align-items:center;justify-content:space-between;gap:9px;margin:4px 0 16px;}
    .weeknav button {background:#1f3445;color:var(--ink);border:1px solid #355366;border-radius:10px;padding:8px 12px;min-width:40px;}
    .card-note {font-size:13px;color:var(--muted);line-height:1.55;}
    .badge {display:inline-flex;align-items:center;color:#b4f7d8;font-weight:800;background:#1f483d;border-radius:999px;font-size:11px;padding:7px 10px;}
    .log-date {font-size:11px;color:var(--muted);}
    .spark {width:100%;height:155px;display:block;}
    .footnote {color:#879eae;font-size:11px;line-height:1.6;margin-top:17px;}
    .switchline {display:flex;align-items:center;justify-content:space-between;gap:15px;margin:14px 0;}
    .switchline input {width:20px;height:20px;accent-color:#91f2cb;}
    .empty {color:var(--muted);text-align:center;padding:26px 18px;line-height:1.5;}
    .toast {position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe));width:max-content;max-width:90vw;background:#b6f6db;color:#102328;font-weight:750;border-radius:14px;padding:11px 16px;box-shadow:0 12px 30px #0008;pointer-events:none;}
    .chiprow {display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
    .chiprow span {display:inline-block;background:#233949;border:1px solid #385366;border-radius:99px;color:#c9dce5;padding:7px 10px;font-size:11px;font-weight:700;}
    .interval-current {font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:1.2px;color:var(--mint);}
    .interval-next {font-size:13px;color:var(--muted);margin:8px 0 0;}
    .iconcheck {background:var(--mint);color:#0b2321;font-weight:850;border-radius:50%;padding:2px 6px;}
    @media(min-width:680px){.shell{padding-top:10px}.nav{border-radius:20px 20px 0 0}.hero{padding:25px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header class="masthead"><div class="brand"><div class="logo">72</div><div>OBJECTIF 72<br><span style="color:var(--muted);font-weight:550;font-size:11px">Plus fort. Plus endurant.</span></div></div><span class="pill" id="headerWeek">Semaine 1 / 12</span></header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Navigation principale"><div class="navin" id="nav">
  <button data-page="home" class="active"><span>⌂</span>Accueil</button>
  <button data-page="workout"><span>✊</span>Muscu</button>
  <button data-page="cardio"><span>♥</span>Cardio</button>
  <button data-page="progress"><span>▥</span>Progrès</button>
  <button data-page="settings"><span>⚙</span>Réglages</button>
</div></nav>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='objectif72_data_v1';
const todayISO=()=>{let d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const safeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultData=()=>({start:'2026-10-12',initialWeight:75,goalWeight:72,initialPushups:30,logs:[],measures:[],sound:true,soundLevel:'fort',keepAwake:true});
let data=load(),page='home',selectedWorkout='A',selectedCardio='outdoor',viewWeek=1;
let timer={kind:null,running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null,startedAt:0};
let awake=null,audioCtx=null,ticker=null,toaster=null,wakeStatus='idle',trainingMode=false;
const WORKOUTS={
 A:{name:'Pectoraux + abdos',day:'Lundi',icon:'✊',duration:35,ex:[
  {id:'a1',name:'Pompes pieds surélevés',target:'8–12 répétitions',tip:'Commence avec une petite surélévation et garde le corps aligné.'},
  {id:'a2',name:'Pompes lentes',target:'10–15 répétitions',tip:'Descends en 3 secondes, sans cambrer.'},
  {id:'a3',name:'Dead bug',target:'8 par côté',tip:'Mouvements contrôlés, dos stable.'},
  {id:'a4',name:'Gainage avant-bras',target:'30 secondes',tip:'Respire normalement et évite de creuser le dos.'}
 ]},
 B:{name:'Dos + jambes + gainage',day:'Mercredi',icon:'◈',duration:35,ex:[
  {id:'b1',name:'Tirage avec sac à dos',target:'12 par côté',tip:'Une main en appui, dos neutre; commence léger.'},
  {id:'b2',name:'Squats',target:'15 répétitions',tip:'Descends à l’amplitude confortable.'},
  {id:'b3',name:'Pont fessier',target:'12 répétitions',tip:'Monte le bassin sans forcer sur les lombaires.'},
  {id:'b4',name:'Gainage latéral',target:'20–30 sec par côté',tip:'Aligne épaules, bassin et jambes.'}
 ]},
 C:{name:'Pectoraux + bras + abdos',day:'Vendredi',icon:'✊',duration:35,ex:[
  {id:'c1',name:'Pompes classiques lentes',target:'12–15 répétitions',tip:'Descends en contrôle et conserve 1 à 2 répétitions en réserve.'},
  {id:'c2',name:'Pompes mains rapprochées',target:'8–12 répétitions',tip:'Mains sous les épaules, coudes proches du corps.'},
  {id:'c3',name:'Dead bug',target:'10 par côté',tip:'Expirer au moment d’étendre bras et jambe.'},
  {id:'c4',name:'Gainage latéral',target:'30 sec par côté',tip:'Arrête avant de perdre l’alignement.'}
 ]}
};
const DAYS=[{day:1,label:'Lundi',title:'Pectoraux + abdos',type:'A',sub:'Musculation · 35 min',icon:'✊'},
{day:2,label:'Mardi',title:'Marche rapide',type:'treadmill',sub:'Tapis · 30 min',icon:'↗'},
{day:3,label:'Mercredi',title:'Dos + jambes',type:'B',sub:'Musculation · 35 min',icon:'◈'},
{day:4,label:'Jeudi',title:'Course dehors',type:'outdoor',sub:'Fractionné progressif · 30 min',icon:'♧'},
{day:5,label:'Vendredi',title:'Pectoraux + bras',type:'C',sub:'Musculation · 35 min',icon:'✊'},
{day:6,label:'Samedi',title:'Travail + récupération',type:'rest',sub:'Sans séance sportive',icon:'☾'},
{day:0,label:'Dimanche',title:'Travail + récupération',type:'rest',sub:'Sans séance sportive',icon:'☾'}];
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.logs)&&Array.isArray(d.measures)?{...defaultData(),...d}:defaultData()}catch(e){return defaultData()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Sauvegarde impossible sur ce navigateur. Utilise Exporter.');return false}}
const currentWeek=()=>{let a=new Date(data.start+'T12:00:00'),b=new Date(todayISO()+'T12:00:00');return Math.max(1,Math.min(12,1+Math.floor((b-a)/604800000)))};
const dayOfWeek=()=>new Date(todayISO()+'T12:00:00').getDay();
const weekForDate=date=>{let a=new Date(data.start+'T12:00:00'),b=new Date(date+'T12:00:00');return Math.max(1,Math.min(12,1+Math.floor((b-a)/604800000)))};
function setsFor(week,id){if(week<=2)return 2;if(week===9)return 2;if(week<=4) return id.endsWith('1')?3:2; if(week>=6 && week<=8 && ['a2','c2'].includes(id))return 3; return ['a1','a3','a4','b1','b2','b3','b4','c1','c3'].includes(id)?3:2;}
function titleForDay(d){return d?d.label+' : '+d.title:'Aujourd’hui, récupère !'}
function latestWeight(){return data.measures.filter(m=>Number.isFinite(+m.weight)&&m.weight!=='').slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.weight??data.initialWeight}
function latestWaist(){return data.measures.filter(m=>Number.isFinite(+m.waist)&&m.waist!=='').slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.waist??null}
function logDone(type,date=todayISO()){return data.logs.some(l=>l.type===type&&l.date===date)}
function weekLogs(week){return data.logs.filter(l=>weekForDate(l.date)===week)}
function completedThisWeek(){return new Set(weekLogs(currentWeek()).map(x=>x.type)).size}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toaster);toaster=setTimeout(()=>t.classList.add('hidden'),3500)}
function pageTitle(s,subtitle){return `<div class="eyebrow">TON DÉFI PERSONNEL</div><h1>${s}</h1><p class="muted" style="margin-top:0">${subtitle}</p>`}
function render(){document.getElementById('headerWeek').textContent=`Semaine ${currentWeek()} / 12`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=document.getElementById('view');if(page==='home')v.innerHTML=homeHTML();if(page==='workout')v.innerHTML=workoutHTML();if(page==='cardio')v.innerHTML=cardioHTML();if(page==='progress')v.innerHTML=progressHTML();if(page==='settings')v.innerHTML=settingsHTML();updateTimerDOM();}
function homeHTML(){const day=DAYS.find(d=>d.day===dayOfWeek());const done=completedThisWeek();const week=currentWeek();const did=day.type!=='rest'&&logDone(day.type);return `<div class="hero"><div class="eyebrow">TON PARCOURS COMMENCE ICI</div><h1>Plus fort.<br>Plus endurant.</h1><p>Trois séances de musculation, de la marche sur tapis et une course dehors. À ton rythme.</p><div class="hero-actions"><button class="btn" data-action="gotoToday">${day.type==='rest'?'Voir mon planning':'Voir ma séance'} →</button><button class="btn secondary" data-page="progress">Mes progrès</button></div></div>
<div class="stats"><div class="stat"><strong>${Number(latestWeight()).toLocaleString('fr-FR')} <span style="display:inline;color:#edf7fc;font-size:13px">kg</span></strong><span>Poids actuel</span></div><div class="stat"><strong>${data.goalWeight} <span style="display:inline;color:#edf7fc;font-size:13px">kg</span></strong><span>Premier objectif</span></div><div class="stat"><strong>${data.initialPushups}</strong><span>Pompes de départ</span></div></div>
<div class="sectiontitle"><h2>Ta semaine</h2><span class="badge">${done} / 5 séances</span></div><div class="card"><div class="trackrow"><span class="small muted">Progression des séances prévues</span><strong>${Math.round(done/5*100)} %</strong></div><div class="progress"><i style="width:${done/5*100}%"></i></div><div style="margin-top:15px">${DAYS.map(d=>`<div class="day"><div class="dayicon">${d.icon}</div><div class="desc"><strong>${d.label} · ${d.title}</strong><span>${d.sub}</span></div>${d.type==='rest'?'<span class="chip">Repos</span>':weekLogs(week).some(l=>l.type===d.type)?'<span class="chip done">✓ Fait</span>':'<span class="chip">À faire</span>'}</div>`).join('')}</div></div>
<div class="sectiontitle"><h2>Aujourd'hui</h2></div><div class="card"><h3>${titleForDay(day)} ${did?'✓':''}</h3><p class="card-note">${day.type==='rest'?'Le travail compte déjà comme une grosse journée. Pense à récupérer.':day.sub+' · échauffement avant l’effort.'}</p><button class="btn full" data-action="gotoToday">${day.type==='rest'?'Consulter le programme':'Ouvrir la séance'} →</button></div>
<div class="tip">🎯 <strong>Le vrai objectif :</strong> devenir plus fort et avoir davantage de souffle. Le chiffre sur la balance n'est qu'un indicateur.</div>`}
function workoutHTML(){const w=WORKOUTS[selectedWorkout];const wk=currentWeek();const doneList=data.logs.filter(l=>l.type===selectedWorkout).slice().sort((a,b)=>b.date.localeCompare(a.date));return `${pageTitle('Musculation','Coche chaque série effectuée, puis lance ton temps de récupération.')}
<div class="tabs">${Object.keys(WORKOUTS).map(k=>`<button data-workout="${k}" class="${selectedWorkout===k?'selected':''}">${WORKOUTS[k].day}</button>`).join('')}</div>
<div class="card"><div class="eyebrow">SÉANCE ${selectedWorkout} · ${w.day.toUpperCase()}</div><h2 style="margin:6px 0 5px">${w.name}</h2><p class="muted small">5 min d'échauffement · 60 à 120 sec de repos. Reste à 1–2 répétitions de l'échec.</p>
<div class="trackrow"><span class="small muted" id="setsCount">Séries réalisées</span><strong id="setsPercent">0 %</strong></div><div class="progress"><i id="setsBar" style="width:0%"></i></div>
<div id="workExList">${w.ex.map(ex=>`<div class="workex"><div class="exercise-head"><div><h3>${ex.name}</h3><div class="small muted" style="margin-top:3px">${ex.tip}</div></div><span>${setsFor(wk,ex.id)} × ${ex.target}</span></div><div class="sets">${Array.from({length:setsFor(wk,ex.id)},(_,i)=>`<button class="set" data-set="${ex.id}:${i}" aria-label="${ex.name}, série ${i+1}" aria-pressed="false">${i+1}</button>`).join('')}</div></div>`).join('')}</div>
<div class="timer"><div class="eyebrow">REPOS ENTRE LES SÉRIES</div><div class="time" id="restTime">01:30</div><div class="timer-actions"><button class="btn secondary sm" data-action="restMinus">− 15 s</button><button class="btn sm" data-action="restToggle" id="restToggle">Démarrer</button><button class="btn secondary sm" data-action="restPlus">+ 15 s</button><button class="btn ghost sm" data-action="restReset">Réinitialiser</button></div><button class="btn secondary sm" id="trainingModeButton" aria-pressed="false" data-action="trainingMode">☀️ Garder l’écran actif pendant la séance</button>
<p class="wake-status" id="wakeStatus" role="status"></p></div>
<button class="btn full" data-action="saveWorkout">✓ Enregistrer ma séance</button><p class="footnote">Tu peux enregistrer une séance partielle. Les séries cochées sont conservées dans le bilan du jour.</p></div>
${doneList.length?`<div class="sectiontitle"><h2>Dernière séance</h2></div><div class="card"><strong>${dateFR(doneList[0].date)}</strong><p class="small muted">${doneList[0].setsDone||0} séries cochées · ${Math.round((doneList[0].setsDone||0)/(doneList[0].setsTotal||1)*100)} % du programme</p></div>`:''}
<div class="tip">Travaille avec une technique confortable, respire régulièrement et évite de forcer si un exercice provoque une douleur.</div>`}

function nowSec(){return Date.now()/1000}
function remainingSeconds(){return timer.running?Math.max(0,Math.ceil(timer.deadline-nowSec())):timer.remaining}

function primeAudio(){
 // Lancement après un vrai toucher utilisateur : indispensable dans de nombreux navigateurs Android.
 if(!data.sound)return;
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 }catch(e){}
}
function audioTick(levelOverride=null){
 if(!data.sound && levelOverride===null)return;
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  const level=levelOverride||data.soundLevel||'fort';
  const volume={doux:.10,normal:.24,fort:.43}[level]??.43;
  const now=audioCtx.currentTime+.025;
  // Trois bips distincts, plus longs et nettement plus audibles que l'ancienne sinusoïde courte.
  // Attaque et relâchement progressifs pour limiter les clics / la saturation au casque.
  for(let i=0;i<3;i++){
   const t=now+i*.32;
   const osc=audioCtx.createOscillator();
   const envelope=audioCtx.createGain();
   osc.type='square';
   osc.frequency.setValueAtTime(i===2?1050:900,t);
   envelope.gain.setValueAtTime(0,t);
   envelope.gain.linearRampToValueAtTime(volume,t+.012);
   envelope.gain.setValueAtTime(volume,t+.17);
   envelope.gain.exponentialRampToValueAtTime(.001,t+.24);
   osc.connect(envelope);
   envelope.connect(audioCtx.destination);
   osc.start(t);osc.stop(t+.25);
  }
 }catch(e){}
 try{navigator.vibrate?.([210,100,210,100,280])}catch(e){}
}
function updateWakeStatusDOM(){
 const el=document.getElementById('wakeStatus');if(!el)return;
 const running=timer.running;
 const btn=document.getElementById('trainingModeButton');if(btn){btn.textContent=trainingMode?'☾ Arrêter le mode écran actif':'☀️ Garder l’écran actif pendant la séance';btn.setAttribute('aria-pressed',String(trainingMode))}
 const enabled=data.keepAwake!==false;
 el.className='wake-status';
 if(!enabled){el.textContent='Écran actif désactivé dans Réglages.';return}
 if(!running&&!trainingMode){el.textContent='📱 Lance le chrono ou active le mode séance pour garder l’écran allumé.';return}
 if(awake && !awake.released){el.textContent='✓ Écran maintenu allumé tant que l’application reste visible.';el.classList.add('active');return}
 if(wakeStatus==='unsupported'){el.textContent='⚠️ Maintien de l’écran indisponible ici. Augmente le délai de veille d’Android ou ouvre la version hébergée en HTTPS.';el.classList.add('warn');return}
 if(wakeStatus==='blocked'){el.textContent='⚠️ Android ou le navigateur bloque le maintien de l’écran. Augmente le délai de veille dans les réglages du téléphone.';el.classList.add('warn');return}
 el.textContent='Tentative de maintien de l’écran allumé…';
}
async function requestWake(){
 if((!timer.running && !trainingMode) || data.keepAwake===false || document.hidden){releaseWake();return}
 if(awake && !awake.released){wakeStatus='active';updateWakeStatusDOM();return}
 if(!('wakeLock' in navigator)){wakeStatus='unsupported';updateWakeStatusDOM();return}
 wakeStatus='requesting';updateWakeStatusDOM();
 try{
  const lock=await navigator.wakeLock.request('screen');
  if((!timer.running && !trainingMode) || data.keepAwake===false || document.hidden){await lock.release();return}
  awake=lock;wakeStatus='active';
  lock.addEventListener('release',()=>{if(awake===lock){awake=null;wakeStatus='released';updateWakeStatusDOM()}});
  updateWakeStatusDOM();
 }catch(e){wakeStatus='blocked';updateWakeStatusDOM()}
}
function releaseWake(){const lock=awake;awake=null;wakeStatus='idle';if(lock)lock.release().catch(()=>{});updateWakeStatusDOM()}
function tick(){if(!timer.running)return;let remaining=remainingSeconds();if(remaining>0){updateTimerDOM();return}audioTick();if(timer.kind==='cardio'){if(timer.idx<timer.phases.length-1){timer.idx++;timer.remaining=timer.phases[timer.idx].min*60;timer.deadline=nowSec()+timer.remaining;toast('Étape : '+timer.phases[timer.idx].name)}else{timer.running=false;timer.remaining=0;if(!trainingMode)releaseWake();toast('Bravo, séance cardio terminée !')}}else{timer.running=false;timer.remaining=0;if(!trainingMode)releaseWake();toast('Récupération terminée !')}updateTimerDOM()}
function clearRunning(){timer.running=false;if(!trainingMode)releaseWake()}
function restToggle(){primeAudio();if(timer.kind!=='rest'){clearRunning();timer={kind:'rest',running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};}if(timer.running){timer.remaining=remainingSeconds();clearRunning()}else{if(timer.remaining<=0)timer.remaining=90;timer.running=true;timer.deadline=nowSec()+timer.remaining;requestWake()}updateTimerDOM()}
function cardioToggle(){primeAudio();if(timer.kind!=='cardio'||timer.planId!==selectedCardio||timer.remaining===0){clearRunning();const plan=planFor(selectedCardio);timer={kind:'cardio',running:false,remaining:plan.parts[0].min*60,deadline:0,phases:plan.parts,idx:0,planId:selectedCardio};}if(timer.running){timer.remaining=remainingSeconds();clearRunning()}else{timer.running=true;timer.deadline=nowSec()+timer.remaining;requestWake()}updateTimerDOM()}
function cardioSkip(){primeAudio();if(timer.kind!=='cardio'||timer.planId!==selectedCardio){cardioToggle();return;}if(timer.idx===timer.phases.length-1){clearRunning();timer.remaining=0;toast('Dernière étape terminée !')}else{timer.idx++;timer.remaining=timer.phases[timer.idx].min*60;if(timer.running)timer.deadline=nowSec()+timer.remaining;audioTick()}updateTimerDOM()}

function action(name){if(name==='gotoToday'){gotoToday();return}if(name==='trainingMode'){trainingMode=!trainingMode;if(trainingMode||timer.running)requestWake();else releaseWake();updateWakeStatusDOM();return}if(name==='restToggle'){restToggle();return}if(name==='restReset'){clearRunning();timer={kind:'rest',running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};updateTimerDOM();return}
if(name==='restMinus'||name==='restPlus'){if(timer.kind!=='rest')timer={kind:'rest',running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};let n=Math.max(15,Math.min(300,remainingSeconds()+(name==='restMinus'?-15:15)));timer.remaining=n;if(timer.running)timer.deadline=nowSec()+n;updateTimerDOM();return}
if(name==='cardioToggle'){cardioToggle();return}if(name==='cardioReset'){clearRunning();timer={kind:null,running:false,remaining:90,deadline:0,phases:[],idx:0,planId:null};render();return}if(name==='cardioSkip'){cardioSkip();return}if(name==='saveWorkout'){saveWorkout();return}if(name==='saveCardio'){saveCardio();return}if(name==='testSound'){const sel=document.querySelector('select[name="soundLevel"]');audioTick(sel?.value||'fort');toast('Bip de test : vérifie le volume multimédia 🔊');return}if(name==='export'){exportData();return}if(name==='import'){document.getElementById('importFile')?.click();return}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.set){b.classList.toggle('checked');b.setAttribute('aria-pressed',b.classList.contains('checked')?'true':'false');updateSetProgress();return}if(b.dataset.workout){selectedWorkout=b.dataset.workout;clearRunning();timer.kind=null;render();return}if(b.dataset.cardio){selectedCardio=b.dataset.cardio;clearRunning();timer.kind=null;render();return}if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}if(b.dataset.action){action(b.dataset.action);return}});
document.addEventListener('submit',e=>{if(e.target.id==='measureForm'||e.target.id==='settingsForm'){e.preventDefault();useForm(e.target)}});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.logs)||!Array.isArray(obj.measures)||typeof obj.start!=='string')throw Error('Format invalide');if(!confirm('Importer cette sauvegarde ? Cela remplacera les données actuelles.'))return;data={...defaultData(),...obj};save();render();toast('Sauvegarde importée !')}catch(err){toast('Fichier de sauvegarde non reconnu.')}e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseWake();else if(timer.running||trainingMode){tick();requestWake()}});
setInterval(tick,250);
// On HTTPS/localhost, cache app resources for offline PWA use. A local HTML file works without SW.
if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
